<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japan Trip Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 한 장짜리 여행 데스크. 위에 지도+입력, 아래로 항공 → 철도패스 → 일별 동선 → 상품. 모바일은 1열 */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --surface2:#EAF0F2; --ink:#14212B; --muted:#586977; --line:#D6DEE3;
  --accent:#0A6C74; --accent-ink:#FFFFFF; --sea:#CFE7E9; --red:#C0392B; --ok:#2C7A3F; --warn:#9A5B00; --warn-bg:#FFF3DD;
  --land:#DDE5E8; --landline:#B7C3CA;
  --f-body:"Zen Kaku Gothic New","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Hiragino Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161C; --surface:#16212A; --surface2:#1D2B35; --ink:#E6EDF1; --muted:#9AAAB6; --line:#2B3B47;
    --accent:#4DBCC4; --accent-ink:#06262A; --sea:#17323A; --red:#EE7B6D; --ok:#6BC283; --warn:#F0B35A; --warn-bg:#33270F;
    --land:#26363F; --landline:#3F5562; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#16212A; --surface2:#1D2B35; --ink:#E6EDF1; --muted:#9AAAB6; --line:#2B3B47;
  --accent:#4DBCC4; --accent-ink:#06262A; --sea:#17323A; --red:#EE7B6D; --ok:#6BC283; --warn:#F0B35A; --warn-bg:#33270F;
  --land:#26363F; --landline:#3F5562; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.sun{width:34px;height:34px;border-radius:50%;background:var(--red);flex:none}
h1{font-size:clamp(22px,4.4vw,32px);font-weight:900;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);max-width:62ch;margin:6px 0 0;font-size:14px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=number],input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em;min-width:0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
h3{font-size:19px;margin:0;font-weight:900;text-wrap:balance}
.map{width:100%;height:auto;display:block;background:var(--sea);border-radius:10px}
.map .land{fill:var(--land);stroke:var(--landline);stroke-width:1}
.map .dot{cursor:pointer}
.map .dot circle.vis{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.map .dot.on circle.vis{fill:var(--accent)}
.map .dot text{font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;pointer-events:none}
.map .dot text.n{fill:var(--accent-ink);stroke:none;font-family:var(--f-mono);font-size:10px;text-anchor:middle}
.map .route{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:5 4}
.map .inset{fill:none;stroke:var(--landline);stroke-dasharray:3 3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:99px;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:520px){.styles{grid-template-columns:minmax(0,1fr)}}
.sty{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface);text-align:left;font:inherit;color:var(--ink)}
.sty b{display:block;font-size:14px}.sty span{font-size:12px;color:var(--muted)}
.sty[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.go{font:inherit;font-weight:900;font-size:16px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;min-height:46px;cursor:pointer;width:100%;margin-top:14px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}
#out{margin-top:22px;display:flex;flex-direction:column;gap:18px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700}
.chain .arr{color:var(--muted)}
.pill{display:inline-block;background:var(--surface2);border-radius:99px;padding:2px 9px;font-size:12px;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:20px;font-family:var(--f-mono);font-weight:600}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.bar .tr{background:var(--surface2);border-radius:5px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px;font-weight:700}
td.r,th.r{text-align:right}
.best{color:var(--ok);font-weight:900}
.region{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.rhead{padding:14px 16px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.rhead .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.passbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:6px}
.passbox div{background:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}
.passbox b{display:block;font-size:15px;color:var(--ink);font-family:var(--f-mono);font-weight:600}
.day{padding:14px 16px;border-top:1px solid var(--line)}
.dayh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.dayh b{font-size:16px}
.spot{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px 12px 44px;margin-top:8px;background:var(--surface)}
.spot.checked{background:var(--surface2)}
.spot.checked .nm{text-decoration:line-through;text-decoration-thickness:1px}
.spot .tm{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.spot .nm{font-weight:900;font-size:16px;display:block}
.spot .jp{color:var(--muted);font-size:12px}
.spot p{margin:6px 0 0;font-size:13.5px}
.spot .tip{color:var(--warn);font-size:13px;margin-top:6px}
.spot .cost{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}
.done{position:absolute;right:10px;bottom:8px;display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700;cursor:pointer;min-height:32px}
.done input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.meal,.move{font-size:13px;color:var(--muted);padding:6px 2px}
.move{color:var(--ink);background:var(--surface2);border-radius:8px;padding:8px 10px;margin-top:8px}
.prod{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.prod a{display:block;border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.prod a:hover{border-color:var(--accent)}
.prod small{color:var(--muted);display:block}
.prod b{display:block}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700}
.prog .tr{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--ok)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.foot{font-size:12px;color:var(--muted)}
.foot a{color:var(--accent)}
.free{font-size:13px;color:var(--muted);padding:8px 2px}
@media (prefers-reduced-motion:no-preference){.chip,.sty,.go{transition:background .15s,box-shadow .15s}}
</style>

<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="sun" aria-hidden="true"></div>
      <div>
        <h1 data-i="title"></h1>
        <p class="sub" data-i="sub"></p>
      </div>
    </div>
    <div class="ctl">
      <label class="f"><span data-i="lang"></span>
        <select id="lang" aria-label="Language"></select></label>
      <label class="f"><span data-i="cur"></span>
        <select id="cur"></select></label>
    </div>
  </header>

  <div class="grid2">
    <section class="panel" aria-labelledby="h-map">
      <h2 id="h-map" data-i="s1"></h2>
      <svg id="map" class="map" viewBox="0 0 400 450" role="img" aria-label="Map of Japan"></svg>
      <div class="chips" id="chips"></div>
      <p class="hint" data-i="s1hint"></p>
    </section>

    <section class="panel" aria-labelledby="h-form">
      <h2 id="h-form" data-i="s2"></h2>
      <div class="fields">
        <label class="f full"><span data-i="origin"></span><select id="origin"></select></label>
        <label class="f"><span data-i="adults"></span><input id="adults" type="number" min="1" max="30" value="2"></label>
        <label class="f"><span data-i="children"></span><input id="children" type="number" min="0" max="30" value="1"></label>
        <label class="f"><span data-i="start"></span><input id="start" type="date"></label>
        <label class="f"><span data-i="end"></span><input id="end" type="date"></label>
        <label class="f full"><span data-i="lodging"></span><select id="lodge"></select></label>
      </div>
      <p class="hint" data-i="childhint"></p>
      <h2 style="margin-top:16px" data-i="s3"></h2>
      <div class="styles" id="styles"></div>
      <button class="go" id="go" data-i="build"></button>
      <div class="warn" id="msg" hidden></div>
    </section>
  </div>

  <div id="out" aria-live="polite"></div>
</div>

<script>
(function(){
"use strict";
/* ---------- i18n ---------- */
var LANGS={ko:"한국어",en:"English",ja:"日本語",zh:"简体中文",es:"Español",fr:"Français"};

var T={
title:{ko:"일본 여행 플래너",en:"Japan Trip Planner",ja:"日本旅行プランナー",zh:"日本旅行规划器",es:"Planificador de viaje a Japón",fr:"Planificateur de voyage au Japon"},
sub:{ko:"지도에서 지역을 고르고 인원·일정·여행 스타일을 입력하면 항공편부터 숙소, 일별 동선, 패스 비교까지 한 번에 계획합니다.",en:"Pick regions on the map, then enter your group, dates and style. You get flights, lodging, a day-by-day route and pass comparisons in one plan.",ja:"地図で地域を選び、人数・日程・旅行スタイルを入力すると、航空券から宿泊、日別ルート、パス比較までまとめて作成します。",zh:"在地图上选择地区，输入人数、日期和旅行风格，即可一次生成机票、住宿、每日路线和交通券比较。",es:"Elige regiones en el mapa e indica grupo, fechas y estilo. Recibes vuelos, alojamiento, ruta diaria y comparación de pases en un solo plan.",fr:"Choisissez des régions sur la carte, puis indiquez groupe, dates et style. Vols, hébergement, itinéraire par jour et comparaison de pass en un seul plan."},
lang:{ko:"언어",en:"Language",ja:"言語",zh:"语言",es:"Idioma",fr:"Langue"},

lux:{ko:"럭셔리 프라이빗",en:"Luxury & private",ja:"ラグジュアリー・貸切",zh:"奢华私享",es:"Lujo y privado",fr:"Luxe et privé"},
lux_d:{ko:"전용 차량·가이드, 그린석, 고급 식사",en:"Private car and guide, Green Car, fine dining",ja:"専用車・ガイド、グリーン車、高級食事",zh:"专车导游、绿色车厢、高级餐饮",es:"Coche y guía privados, Green Car, alta cocina",fr:"Voiture et guide privés, Green Car, gastronomie"},
lg_hostel:{ko:"호스텔·캡슐",en:"Hostel / capsule",ja:"ホステル・カプセル",zh:"青旅/胶囊",es:"Hostal / cápsula",fr:"Auberge / capsule"},
lg_biz:{ko:"비즈니스 호텔",en:"Business hotel",ja:"ビジネスホテル",zh:"商务酒店",es:"Hotel de negocios",fr:"Hôtel d'affaires"},

/* ---------- planning ---------- */
function entryMin(origin,id){var C=CITIES[origin],g=GW[R[id].gw];return hav(C[2],C[3],g[1],g[2])/820*60+50+R[id].gm;}
function bestOrder(sel,origin){
  if(sel.length===1)return sel.slice();
  var best=null,bm=1e12;
  function cost(arr){var m=entryMin(origin,arr[0])+entryMin(origin,arr[arr.length-1]);for(var i=0;i<arr.length-1;i++)m+=leg(arr[i],arr[i+1]).min;return m;}
  if(sel.length<=8){
    (function perm(arr,rest){if(!rest.length){var c=cost(arr);if(c<bm){bm=c;best=arr.slice();}return;}for(var i=0;i<rest.length;i++){var r2=rest.slice();var x=r2.splice(i,1)[0];arr.push(x);perm(arr,r2);arr.pop();}})([],sel.slice());
    return best;
  }
  var left=sel.slice(),cur=left.splice(0,1)[0],out=[cur];
  while(left.length){var bi=0,bv=1e12;for(var j=0;j<left.length;j++){var v=leg(cur,left[j]).min;if(v<bv){bv=v;bi=j;}}cur=left.splice(bi,1)[0];out.push(cur);}
  return out;
}
function alloc(order,D){
  var tw=0,i;order.forEach(function(id){tw+=R[id].w;});
  var base=order.map(function(){return 1;}),rem=D-order.length;
  var quota=order.map(function(id){return R[id].w/tw*D;});
  var give=order.map(function(_,k){return Math.max(1,Math.floor(quota[k]));});
  var sum=give.reduce(function(a,b){return a+b;},0);
  while(sum>D){var mi=-1,mv=-1;for(i=0;i<give.length;i++){if(give[i]>1&&give[i]-quota[i]>mv){mv=give[i]-quota[i];mi=i;}}if(mi<0)break;give[mi]--;sum--;}
  while(sum<D){var bi=0,bv=-1;for(i=0;i<give.length;i++){var f=quota[i]-give[i];if(f>bv){bv=f;bi=i;}}give[bi]++;sum++;}
  return give;
}
function build(){
  var msg=$("msg");msg.hidden=true;
  S.A=Math.max(1,Math.min(30,parseInt($("adults").value,10)||1));
  S.C=Math.max(0,Math.min(30,parseInt($("children").value,10)||0));
  S.origin=$("origin").value;S.lodge=$("lodge").value;S.start=$("start").value;S.end=$("end").value;
  function bad(k,extra){msg.textContent=t(k)+(extra||"");msg.hidden=false;S.plan=null;$("out").innerHTML="";drawMap();}
  if(!S.sel.length)return bad("noRegion");
  if(!S.start||!S.end)return bad("badDates");
  var D=Math.round((addDays(S.end,0)-addDays(S.start,0))/864e5)+1;
  if(D<1)return bad("badDates");
  if(D>30)return bad("tooLong");
  if(D<S.sel.length)return bad("minDays"," "+S.sel.length);
  var st=STY[S.style],A=S.A,C=S.C,pw=A+0.5*C,aw=A+0.75*C,persons=A+C;
  var order=bestOrder(S.sel,S.origin),give=alloc(order,D);

  /* calendar */
  var cal=[],di=0;
  order.forEach(function(id,ri){for(var k=0;k<give[ri];k++){cal.push({i:di,date:addDays(S.start,di),rid:id,ri:ri,k:k,first:k===0&&ri>0,arrival:di===0,departure:di===D-1});di++;}});
  var base=st.cap-(C>0?1:0);if(base<2)base=2;
  cal.forEach(function(d){d.cap=base;if(d.arrival||d.departure||d.first)d.cap=Math.max(1,base-1);if(d.arrival&&d.departure)d.cap=1;});

  /* spots to days */
  var byRegion={};
  order.forEach(function(id,ri){
    var days=cal.filter(function(d){return d.rid===id;});
    var total=days.reduce(function(a,d){return a+d.cap;},0);
    var all=SP[id].map(function(s,ix){return{s:s,ix:ix};});
    var chosen=all.slice().sort(function(a,b){return a.s[6]-b.s[6]||a.ix-b.ix;}).slice(0,total).sort(function(a,b){return a.s[5]-b.s[5]||a.ix-b.ix;});
    var p=0;
    days.forEach(function(d){d.spots=[];while(d.spots.length<d.cap&&p<chosen.length){d.spots.push(chosen[p].s);p++;}});
    byRegion[id]={days:days,spots:chosen.map(function(c){return c.s;})};
  });

  /* region costs & pass compare */
  var cost={flight:0,air:0,rail:0,local:0,adm:0,food:0,lodge:0,priv:0};
  var lux=S.style==="lux";
  var regionInfo={};
  order.forEach(function(id,ri){
    var r=R[id],d=give[ri],spots=byRegion[id].spots;
    var admAll=0,admUnc=0;spots.forEach(function(s){admAll+=s[4]*(A+0.5*C);admUnc+=(s[8]?0:s[4])*(A+0.5*C);});
    var noTransit,passTransit=0,hasPass=!!r.pb;
    if(r.car){noTransit=r.car*Math.ceil(persons/5)*d;passTransit=noTransit;}
    else noTransit=((r.td*d)+(r.tf||0))*pw;
    var passCost=hasPass?pcost(r.pb,d)*pw:0;
    var noP=noTransit+admAll, withP=hasPass?passCost+admUnc:noP;
    var use=hasPass&&withP<noP&&!lux;
    regionInfo[id]={hasPass:hasPass,noP:noP,withP:withP,use:use,admAll:admAll,admUnc:admUnc,noTransit:noTransit,passCost:passCost,car:!!r.car};
    if(lux){
      cost.priv+=Math.ceil(persons/6)*70000*d;cost.adm+=admAll;
    }else if(use){cost.local+=passCost;cost.adm+=admUnc;}
    else{cost.local+=noTransit;cost.adm+=admAll;}
  });

  /* legs */
  var legs=[],airTotal=0;
  for(var li=0;li<order.length-1;li++){
    var L=leg(order[li],order[li+1]);L.from=order[li];L.to=order[li+1];
    L.day=cal.filter(function(d){return d.rid===order[li+1];})[0].i;legs.push(L);
    if(L.air){airTotal+=L.yen*aw;}
  }
  cost.air=airTotal;

  /* JR analysis */
  var jr=jrAnalysis(legs,pw,lux);
  cost.rail=jr.best.total-0;

  /* flights */
  var oc=CITIES[S.origin],g1=R[order[0]].gw,g2=R[order[order.length-1]].gw;
  var km1=hav(oc[2],oc[3],GW[g1][1],GW[g1][2]);
  var cls=lux?3.6:S.style==="com"?1.6:1;
  var usd=(150+km1*0.075)*cls;if(g1!==g2)usd*=1.1;
  var fareA=usd*CURR.USD.r;
  cost.flight=fareA*(A+0.75*C);
  var fl={g1:g1,g2:g2,km:km1,min:km1/820*60+40,fareA:fareA};

  /* lodging */
  var lg=LG[S.lodge],rooms=0;
  var nightsBy=order.map(function(id,ri){return give[ri]-(ri===order.length-1?1:0);});
  order.forEach(function(id,ri){
    var n=nightsBy[ri];if(n<=0)return;var f=R[id].lf,y;
    if(lg.unit==="p"){y=lg.y*f*persons*(S.lodge==="ryokan"?1:1);if(C>0)y-=lg.y*f*C*0.3;}
    else{var need=A+C*0.5;var rm=Math.max(1,Math.ceil(need/lg.cap));if(rm>rooms)rooms=rm;y=lg.y*f*rm;}
    cost.lodge+=y*n;
  });
  /* food */
  var foodDay=FOODDAY[S.style]*(A+0.6*C);
  cost.food=foodDay*D;
  if(S.lodge==="ryokan"){var rn2=nightsBy.reduce(function(a,b){return a+Math.max(0,b);},0);cost.food-=foodDay*0.55*rn2;}
  if(lux){cost.priv+=Math.ceil(persons/6)*40000*2;}

  var total=0;for(var kk in cost)total+=cost[kk];
  S.plan={order:order,give:give,cal:cal,byRegion:byRegion,regionInfo:regionInfo,legs:legs,jr:jr,fl:fl,cost:cost,total:total,D:D,rooms:rooms,nightsBy:nightsBy,pw:pw,aw:aw};
  draw();
}
function jrAnalysis(legs,pw,lux){
  var f=lux?1.4:1;
  var rail=legs.filter(function(L){return !L.air;});
  var cash=0;rail.forEach(function(L){cash+=L.yen*f*pw;});
  var cov=rail.filter(function(L){return L.jr==="cov"||L.jr==="part";});
  var opts=[{id:"cash",name:t("jr_cash"),total:cash}];
  if(cov.length){
    var d0=Math.min.apply(null,cov.map(function(L){return L.day;})),d1=Math.max.apply(null,cov.map(function(L){return L.day;}));
    var span=d1-d0+1,dur=span<=7?7:span<=14?14:span<=21?21:0;
    if(dur){
      var P=lux?{7:[74000,37000],14:[116000,58000],21:[147000,74000]}:{7:[53000,27000],14:[84000,42000],21:[105000,53000]};
      var sS=P[dur],A=S.A,C=S.C;
      var passCost=sS[0]*A+sS[1]*C;
      var covCash=0;cov.forEach(function(L){covCash+=L.yen*f*pw;});
      opts.push({id:"nat",name:t("jr_nat")+" "+dur+(S.lang==="ko"?"일":"d")+(lux?" Green":""),total:cash-covCash+passCost,note:span});
    }
    if(!lux){
      [["kwide","JR Kansai WIDE Area Pass (5d)",12000,5,["kyoto","osaka"]],["khiro","JR Kansai-Hiroshima Area Pass (5d)",17000,5,["kyoto","osaka","hiroshima"]],["sanyo","JR Sanyo-San'in Area Pass (7d)",23000,7,["osaka","hiroshima","fukuoka"]]].forEach(function(p){
        var inA=cov.filter(function(L){return p[4].indexOf(L.from)>=0&&p[4].indexOf(L.to)>=0;});
        if(!inA.length)return;
        var a0=Math.min.apply(null,inA.map(function(L){return L.day;})),a1=Math.max.apply(null,inA.map(function(L){return L.day;}));
        if(a1-a0+1>p[3])return;
        var cc=0;inA.forEach(function(L){cc+=L.yen*pw;});
        var pc=p[2]*pw;
        opts.push({id:p[0],name:p[1],total:cash-cc+pc});
      });
    }
  }
  var best=opts[0];opts.forEach(function(o){if(o.total<best.total-1)best=o;});
  return{opts:opts,best:best,cash:cash,hasRail:rail.length>0,hasCov:cov.length>0};
}

    list.forEach(function(p){
      var url="https://www.getyourguide.com/s/?q="+encodeURIComponent(p[3]);
      h+="<a href=\""+url+"\" target=\"_blank\" rel=\"noopener\"><small>"+esc(rn(id))+"</small><b>"+esc(koen(p[0],p[1]))+"</b><small class=\"num\">"+esc(p[2])+"</small><small style=\"color:var(--accent);font-weight:700\">"+esc(t("search"))+" ↗</small></a>";
    });
  });
  h+="</div></section><p class=\"foot\">"+esc(t("disc"))+"</p>";
  out.innerHTML=h;
  bindChecks();updProg();
}
function bindChecks(){
  var cs=$("out").querySelectorAll("input[data-sp]");
  for(var i=0;i<cs.length;i++){cs[i].onchange=function(){var id=this.getAttribute("data-sp");if(this.checked)S.done[id]=1;else delete S.done[id];saveDone();var card=$("sp-"+id);if(card)card.classList.toggle("checked",this.checked);updProg();};}
}
function updProg(){
  var p=$("prog");if(!p||!S.plan)return;var tot=0,dn=0;
  S.plan.order.forEach(function(id){S.plan.byRegion[id].spots.forEach(function(s){tot++;if(S.done[s[0]])dn++;});});
  p.innerHTML="<span>"+esc(t("prog"))+" "+dn+" / "+tot+"</span><span class=\"tr\"><i style=\"width:"+(tot?dn/tot*100:0)+"%\"></i></span>";
}

/* ---------- init ---------- */
(function(){
  var today=new Date();var s=new Date(Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()+30));
  S.start=iso(s);S.end=iso(addDays(S.start,6));
  $("start").value=S.start;$("end").value=S.end;
})();
$("lang").onchange=function(){S.lang=this.value;if(!S.curTouched)S.cur=CUR_BY_LANG[S.lang];readForm();applyI18n();restoreForm();if(S.plan)build();};
$("cur").onchange=function(){S.cur=this.value;S.curTouched=true;draw();};
$("go").onclick=build;
function readForm(){S.A=parseInt($("adults").value,10)||1;S.C=parseInt($("children").value,10)||0;S.origin=$("origin").value;S.lodge=$("lodge").value;S.start=$("start").value;S.end=$("end").value;}
function restoreForm(){$("adults").value=S.A;$("children").value=S.C;$("start").value=S.start;$("end").value=S.end;}
$("origin").onchange=function(){S.origin=this.value;};
applyI18n();
build();
})();
</script>

</body></html>
